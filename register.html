<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodSync | Account Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans flex flex-col justify-between transition-colors duration-300">

    <!-- Header Navigation Bar -->
    <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700 px-6 py-4 sticky top-0 z-40 shadow-sm transition-colors duration-300">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <a href="index.html" class="flex items-center space-x-3">
                <span class="text-3xl">🩸</span>
                <span class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">BloodSync<span class="text-red-600">AI</span></span>
            </a>

            <!-- Navigation Tags -->
            <nav class="flex items-center space-x-2 md:space-x-6 text-sm font-bold">
                <a href="index.html" class="text-slate-600 dark:text-slate-300 hover:text-red-600 transition">Home</a>
                <a href="index.html" class="text-slate-600 dark:text-slate-300 hover:text-red-600 transition">Login Page</a>
                <a href="register.html" class="text-red-600 dark:text-red-400">Register Account</a>
                
                <!-- Dark / Light Mode Toggle -->
                <button onclick="toggleTheme()" class="p-2 bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-amber-300 rounded-xl border dark:border-slate-600 transition shadow-sm text-base" title="Toggle Dark/Light Mode">
                    <span id="themeIcon">🌙</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-xl mx-auto my-10 p-6 w-full">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border-t-8 border-red-600" id="regCardBorder">
            <h2 class="text-3xl font-black text-slate-900 dark:text-white mb-2">Create Your Account</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Enter details to register and open your portal profile.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Account Type</label>
                    <select id="regRole" onchange="toggleRoleFields()" class="w-full border-2 border-red-500 p-3 rounded-xl outline-none font-bold text-slate-900 dark:bg-slate-700 dark:text-white bg-red-50">
                        <option value="donor">I want to be a Donor ❤️</option>
                        <option value="requestor">I am a Requestor / Hospital Attendant 🏥</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Full Name *</label>
                    <input id="regName" type="text" placeholder="John Doe" class="w-full border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 p-3 rounded-xl outline-none focus:border-red-500 font-bold">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Gmail / Email Address *</label>
                    <input id="regEmail" type="email" placeholder="john@gmail.com" class="w-full border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 p-3 rounded-xl outline-none focus:border-red-500 font-bold">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Mobile Number *</label>
                    <input id="regPhone" type="tel" placeholder="9876543210" class="w-full border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 p-3 rounded-xl outline-none focus:border-red-500 font-bold">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Blood Group *</label>
                        <select id="regGroup" class="w-full border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 p-3 rounded-xl outline-none font-bold text-red-600 dark:text-red-400">
                            <option value="O+">O+</option><option value="O-">O-</option>
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Password *</label>
                        <div class="relative">
                            <input id="regPassword" type="password" placeholder="••••••••" class="w-full border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 p-3 pr-10 rounded-xl outline-none focus:border-red-500 font-bold">
                            <button type="button" onclick="togglePasswordVisibility('regPassword', 'regEyeIcon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 p-1 font-bold text-sm select-none">
                                <span id="regEyeIcon">👁️</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">State *</label>
                        <select id="regState" onchange="populateCities()" class="w-full border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 p-3 rounded-xl outline-none font-bold">
                            <option value="" disabled selected>Select State</option>
                            <option value="Telangana">Telangana</option>
                            <option value="Andhra Pradesh">Andhra Pradesh</option>
                            <option value="Karnataka">Karnataka</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">City *</label>
                        <select id="regCity" disabled class="w-full border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 p-3 rounded-xl outline-none bg-slate-100 font-bold">
                            <option value="" disabled selected>Select City</option>
                        </select>
                    </div>
                </div>

                <div id="donorFields">
                    <label class="block text-xs font-bold uppercase mb-1">Date of Last Blood Donation *</label>
                    <input id="regDate" type="date" class="w-full border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 p-3 rounded-xl outline-none text-red-600 dark:text-red-400 font-bold">
                </div>

                <div id="requestorFields" class="hidden">
                    <label class="block text-xs font-bold uppercase mb-1">Blood Amount Required (Units) *</label>
                    <input id="regUnits" type="number" min="1" max="10" value="1" class="w-full border-2 border-blue-300 dark:border-blue-600 p-3 rounded-xl outline-none font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-slate-700">
                </div>

                <button onclick="submitRegistration()" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition text-base mt-2" id="regBtn">
                    Complete Registration & Enter Dashboard →
                </button>
                <p id="regStatus" class="text-sm font-bold text-center"></p>
            </div>
        </div>
    </main>

    <footer class="max-w-7xl mx-auto w-full px-8 py-4 text-center text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800">
        BloodSync Enterprise System
    </footer>

    <script>
        const API = "https://bloodsync-mmej.onrender.com";
        document.getElementById('regDate').value = new Date().toISOString().split('T')[0];

        const urlParams = new URLSearchParams(window.location.search);
        const presetRole = urlParams.get('role');
        if (presetRole) {
            document.getElementById('regRole').value = presetRole;
        }
        toggleRoleFields();

        // Theme Switcher Logic
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            applyTheme(savedTheme);
        }
        function toggleTheme() {
            const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(newTheme);
        }
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').innerText = '🌙';
            }
            localStorage.setItem('theme', theme);
        }
        initTheme();

        function togglePasswordVisibility(inputId, iconId) {
            const field = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (field.type === "password") {
                field.type = "text";
                icon.innerText = "🙈";
            } else {
                field.type = "password";
                icon.innerText = "👁️";
            }
        }

        const locationData = {
            "Telangana": ["Hyderabad", "Nalgonda", "Warangal", "Karimnagar", "Khammam"],
            "Andhra Pradesh": ["Visakhapatnam", "Vijayawada", "Guntur", "Nellore", "Tirupati"],
            "Karnataka": ["Bengaluru", "Mysuru", "Mangaluru", "Hubli", "Belagavi"]
        };

        function toggleRoleFields() {
            const role = document.getElementById('regRole').value;
            const donorBlock = document.getElementById('donorFields');
            const reqBlock = document.getElementById('requestorFields');
            const cardBorder = document.getElementById('regCardBorder');
            const btn = document.getElementById('regBtn');

            if (role === 'donor') {
                donorBlock.classList.remove('hidden');
                reqBlock.classList.add('hidden');
                cardBorder.className = "bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border-t-8 border-red-600";
                btn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition text-base mt-2";
            } else {
                reqBlock.classList.remove('hidden');
                donorBlock.classList.add('hidden');
                cardBorder.className = "bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border-t-8 border-blue-600";
                btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition text-base mt-2";
            }
        }

        function populateCities() {
            const state = document.getElementById('regState').value;
            const citySelect = document.getElementById('regCity');
            citySelect.innerHTML = '<option value="" disabled selected>Select City</option>';
            
            if (state && locationData[state]) {
                citySelect.disabled = false;
                citySelect.classList.remove('bg-slate-100');
                locationData[state].forEach(city => {
                    let opt = document.createElement('option');
                    opt.value = city;
                    opt.innerHTML = city;
                    citySelect.appendChild(opt);
                });
            }
        }

        async function submitRegistration() {
            const role = document.getElementById('regRole').value;
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const group = document.getElementById('regGroup').value;
            const state = document.getElementById('regState').value;
            const city = document.getElementById('regCity').value;
            const dateVal = document.getElementById('regDate').value;
            const unitsVal = document.getElementById('regUnits').value;
            const status = document.getElementById('regStatus');

            if (!name) {
                alert("⚠️ Alert: Please enter your Full Name.");
                return;
            }
            
            if (!phone || phone.length < 10) {
                alert("⚠️ Alert: Please enter a valid 10-digit Mobile Number.");
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailPattern.test(email)) {
                alert("⚠️ Alert: Please enter a valid Gmail / Email address (e.g. user@gmail.com).");
                return;
            }

            if (!password || password.length < 6) {
                alert("⚠️ Alert: Password must be at least 6 characters long.");
                return;
            }

            if (!state || !city) {
                alert("⚠️ Alert: Please select both State and City.");
                return;
            }

            if (role === 'donor' && !dateVal) {
                alert("⚠️ Alert: Please enter your Date of Last Blood Donation.");
                return;
            }

            if (role === 'requestor' && (!unitsVal || parseInt(unitsVal) < 1)) {
                alert("⚠️ Alert: Please enter a valid number of blood units required (at least 1).");
                return;
            }

            status.innerText = "Creating Account & Authorizing...";

            try {
                const res = await fetch(`${API}/api/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        role: role, name: name, email: email, password: password, phone: phone,
                        blood_group: group, state: state, city: city,
                        last_donation_date: role === 'donor' ? dateVal : "",
                        units_required: role === 'requestor' ? parseInt(unitsVal) : 1
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("currentUser", JSON.stringify(data.user));
                    alert("🎉 Success: Account created! Directing directly to your dashboard...");
                    window.location.href = data.redirect;
                } else {
                    const errData = await res.json();
                    alert(`❌ Registration Error: ${errData.detail || "Unable to register."}`);
                    status.innerText = errData.detail || "Registration error occurred.";
                    status.className = "text-sm font-bold text-center text-red-600 mt-4";
                }
            } catch (e) {
                alert("⚠️ Connection Error: Unable to connect to backend server.");
                status.innerText = "Server connection error.";
                status.className = "text-sm font-bold text-center text-red-600 mt-4";
            }
        }
    </script>
</body>
</html>
